<!DOCTYPE html>
<html lang="fa">
<head>
<meta charset="UTF-8">
<title>Jewelry Label</title>
{% load jalali_tags %}

<style>
  @page { size: 49mm 10mm; margin: 0; }

  body {
    width: 49mm;
    height: 10mm;
    margin: 0;
    padding: 0;
    direction: rtl;
    font-family: sans-serif;
  }

  .wrapper {
    display: flex;
    width: 49mm;
    height: 10mm;
  }

  /* بخش راست – اطلاعات */
  .right-box {
    width: 23mm;
    height: 10mm;
    padding: 1mm;
    font-size: 8.5px;
    line-height: 1.2;
    box-sizing: border-box;
    text-align: right;
  }

  .right-box .title {
    font-weight: bold;
    font-size: 9px;
  }

  /* نوار وسط لیبل */
  .middle {
    width: 3mm;
    height: 10mm;
  }

  /* بخش چپ – بارکد */
  .left-box {
    width: 23mm;
    height: 10mm;
    display: flex;
    justify-content: center;
    align-items: center;
  }

  img.barcode {
    width: 22mm;
    height: 9.5mm;
  }
</style>

</head>
<body>

<div class="wrapper">

  <!-- بخش راست -->
  <div class="right-box">
    <div class="title">{{ store_name }}</div>
    وزن: {{ product.weight|persian_digits }} گرم<br>
    کد: {{ product.code }}
  </div>

  <!-- نوار وسط (فضای خالی لیبل) -->
  <div class="middle"></div>

  <!-- بخش چپ -->
  <div class="left-box">
    <img class="barcode" src="data:image/png;base64,{{ barcode_data }}">
  </div>

</div>

<script>
  window.print();
</script>

</body>
</html>
