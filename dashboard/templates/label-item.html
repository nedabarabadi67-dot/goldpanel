<!DOCTYPE html>
<html lang="fa">
<head>
<meta charset="UTF-8">
<title>Jewelry Label</title>
{% load jalali_tags %}
<style>
@page {
  size: 80mm 10mm;
  margin: 0;
}
body {
  width: 80mm;
  height: 10mm;
  margin: 0;
  padding: 0;
  direction: rtl;
  font-family: Tahoma, sans-serif;
}
.wrapper {
  display: flex;
  width: 80mm;
  height: 10mm;
  direction: ltr; /* برای قرار گرفتن دم موشی سمت چپ */
}

/* قسمت دم‌موشی (چپ) */
.empty-area {
  width: 40mm;
  height: 10mm;
}

/* قسمت چاپی (راست) */
.print-area {
  width: 40mm;
  height: 10mm;
  display: flex;
}

.right-box {
  width: 17mm;
  height: 10mm;
  padding: 1mm;
  font-size: 8.5px;
  line-height: 1.2;
  text-align: right;
  box-sizing: border-box;
}

.right-box .title {
  font-weight: bold;
  font-size: 9px;
}

.middle {
  width: 5mm;
  height: 10mm;
}

.left-box {
  width: 15mm;
  height: 10mm;
  display: flex;
  justify-content: center;
  align-items: center;
}

img.barcode {
  width: 15mm;
  height: 9.5mm;
}

@media print {
  body { margin: 0; }
}
</style>
</head>
<body>

<div class="wrapper">
 {% for item in purchase_items %}
  <!-- دم‌موشی سمت چپ -->
  <div class="empty-area"></div>

  <!-- قسمت چاپ سمت راست -->
  <div class="print-area">
    <div class="right-box">
      <div class="title">{{ store_name }}</div>
      وزن: {{ item.product.weight|persian_digits }} گرم<br>
       {{ item.product.code }}:کد           </div>

    <div class="middle"></div>

    <div class="left-box">
      <img class="barcode" src="data:image/png;base64,{{item.barcode_image }}">
    </div>
  </div>
{% endfor %}
</div>

<script>
  window.print();
</script>

</body>
</html>
